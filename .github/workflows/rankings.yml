name: Refresh rankings

on:
  schedule:
    - cron: '17 1,13 * * *'
  workflow_dispatch:
    inputs:
      initialize_votes:
        description: 'Create the voting issue and missing work comments (first run / new works)'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'CODE-AUDIT.md'
      - 'scripts/rankings.py'
      - '.github/workflows/rankings.yml'

permissions:
  contents: read

concurrency:
  group: rankings
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'jiachengliu12345/awesome-fable-5-2' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test ranking and vote rules
        run: python -m unittest discover -s tests -v
      - name: Initialize voting (manual opt-in only)
        if: github.event_name == 'workflow_dispatch' && inputs.initialize_votes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/rankings.py --initialize-votes
      - name: Refresh and generate tables
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/rankings.py --refresh
      - name: Commit updated observations
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/rankings.json data/voting.json POPULARITY.md COMMUNITY-RANKING.md
          if ! git diff --cached --quiet; then
            git commit -m 'Update platform popularity and reader votes'
            git push
          fi
      - name: Retain generated files if publishing fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rankings-recovery
          path: |
            data/rankings.json
            data/voting.json
            POPULARITY.md
            COMMUNITY-RANKING.md

